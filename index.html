<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テスト対策 Ver.3.6</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #eef2f6;
      --ink: #17202a;
      --muted: #566573;
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --primary-soft: #e3f2fd;
      --accent: #6a1b9a;
      --accent-soft: #f3e5f5;
      --success: #2e7d32;
      --success-soft: #e8f5e9;
      --danger: #c62828;
      --danger-soft: #ffebee;
      --hint: #ef6c00;
      --hint-soft: #fff3e0;
      --border: #d5dce4;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--surface-alt);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    button.active-tab {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2, .card h3 {
      margin-top: 0;
    }

    .unit-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      margin: 12px 0 16px;
    }

    .unit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-alt);
    }

    .unit-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .quiz-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 700;
      margin: 10px 0 16px;
      white-space: pre-wrap;
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .choice-btn {
      text-align: left;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .choice-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .answer-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .answer-row input {
      flex: 1;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .feedback {
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.ok {
      background: var(--success-soft);
      border: 1px solid #a5d6a7;
      color: var(--success);
    }

    .feedback.ng {
      background: var(--danger-soft);
      border: 1px solid #ef9a9a;
      color: var(--danger);
    }

    .info-box {
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .info-box.show {
      display: block;
    }

    .info-box.hint {
      background: var(--hint-soft);
      border: 1px solid #ffcc80;
      color: #6d3600;
    }

    .info-box.explain {
      background: var(--primary-soft);
      border: 1px solid #90caf9;
      color: var(--primary-dark);
    }

    .info-box.similar {
      background: var(--accent-soft);
      border: 1px solid #ce93d8;
      color: #4a148c;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .admin-grid {
      display: grid;
      gap: 10px;
    }

    .admin-grid input, .admin-grid select, .admin-grid textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--success);
      font-weight: 600;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="brand-title">テスト対策 Ver.3.6</h1>
      <div class="brand-sub" id="statusSummary">読み込み中...</div>
    </div>
    <nav class="nav-group">
      <button type="button" id="tabHome" class="active-tab">ホーム・単元設定</button>
      <button type="button" id="tabQuiz" class="primary">問題ページを開く</button>
      <button type="button" id="tabAdmin">管理者モード</button>
    </nav>
  </header>

  <main class="container">
    <!-- ホーム・単元設定 -->
    <section id="viewHome" class="view active">
      <div class="card">
        <h2>出題する単元を選択</h2>
        <p>ONにした単元の問題から出題されます。最低1つはONにしてください。</p>
        <div class="action-bar" style="margin-top:0; margin-bottom:10px;">
          <button type="button" id="btnAllOn">すべてON</button>
          <button type="button" id="btnAllOff">すべてOFF</button>
          <button type="button" class="primary" id="btnStartFromHome">この条件で問題ページを開く</button>
        </div>
        <div id="unitList" class="unit-list"></div>
      </div>

      <div class="card">
        <h3>学習記録（自動保存）</h3>
        <p id="statsText">回答数: 0問 / 正解数: 0問</p>
        <button type="button" id="btnResetStats">学習記録をリセット</button>
      </div>
    </section>

    <!-- 問題ページ -->
    <section id="viewQuiz" class="view">
      <div class="card">
        <div class="quiz-meta">
          <span class="badge" id="qUnitBadge">単元</span>
          <span id="qProgress">問題 1 / 1</span>
          <span id="qScore">正解 0 / 解答 0</span>
        </div>

        <div class="question-text" id="qText">問題文を読み込んでいます...</div>

        <div id="qChoices" class="choices"></div>

        <div id="qInputArea" class="answer-row" style="display:none;">
          <input type="text" id="qInput" placeholder="答えを入力してください" autocomplete="off" />
        </div>

        <div class="action-bar" style="margin-top:0;">
          <button type="button" class="primary" id="btnCheckAnswer">解答する</button>
          <button type="button" id="btnToggleHint">ヒント</button>
          <button type="button" id="btnToggleExplain">解説</button>
          <button type="button" class="accent" id="btnToggleSimilar">類題</button>
        </div>

        <div id="feedbackBox" class="feedback"></div>
        <div id="hintBox" class="info-box hint"></div>
        <div id="explainBox" class="info-box explain"></div>
        <div id="similarBox" class="info-box similar"></div>

        <div class="action-bar">
          <button type="button" id="btnPrevQ">前の問題</button>
          <button type="button" class="primary" id="btnNextQ">次の問題</button>
          <button type="button" id="btnShuffleQ">シャッフル出題</button>
          <button type="button" id="btnBackHome">単元設定に戻る</button>
        </div>
      </div>
    </section>

    <!-- 管理者モード -->
    <section id="viewAdmin" class="view">
      <div class="card" id="adminLockCard">
        <h2>管理者ロック解除</h2>
        <p>問題データの追加やJSON入出力を行うにはパスコードを入力してください（初期値: <code>1234</code>）。</p>
        <div class="answer-row">
          <input type="password" id="adminPassInput" placeholder="パスコード (1234)" />
          <button type="button" class="primary" id="btnUnlockAdmin">解除する</button>
        </div>
        <div id="lockMessage" class="status-msg"></div>
      </div>

      <div id="adminPanel" style="display:none;">
        <div class="card">
          <h2>新規問題の追加</h2>
          <div class="admin-grid">
            <label>単元名
              <input type="text" id="newUnit" placeholder="例: 英語・文法" />
            </label>
            <label>問題文
              <textarea id="newQuestion" rows="2" placeholder="問題文を入力"></textarea>
            </label>
            <label>選択肢（4択の場合はカンマ区切り、記述式の場合は空欄）
              <input type="text" id="newChoices" placeholder="例: go, goes, going, gone" />
            </label>
            <label>正解（選択肢の場合は完全一致の文字列、記述式は正答）
              <input type="text" id="newAnswer" placeholder="例: goes" />
            </label>
            <label>ヒント
              <input type="text" id="newHint" placeholder="ヒントを入力" />
            </label>
            <label>解説
              <textarea id="newExplain" rows="2" placeholder="解説を入力"></textarea>
            </label>
            <label>類題（問題と答え）
              <input type="text" id="newSimilar" placeholder="例: She (play) tennis every Sunday. → plays" />
            </label>
          </div>
          <div class="action-bar">
            <button type="button" class="primary" id="btnAddQuestion">問題を追加</button>
            <button type="button" id="btnLockAdmin">管理者ロックをかける</button>
          </div>
          <div id="adminMessage" class="status-msg"></div>
        </div>

        <div class="card">
          <h3>問題データのJSONバックアップ / 読み込み</h3>
          <textarea id="jsonArea" rows="6" placeholder="ここにJSONデータが表示されます。貼り付けて読み込むこともできます。"></textarea>
          <div class="action-bar">
            <button type="button" id="btnExportJson">現在の問題をJSON表示</button>
            <button type="button" class="primary" id="btnImportJson">JSONから問題を反映</button>
            <button type="button" class="danger" id="btnResetDefaultData">初期サンプルに戻す</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "test_taisaku_v36_state_v1";
      const ADMIN_PASS = "1234";

      const DEFAULT_QUESTIONS = [
        {
          id: "q1",
          unit: "英語・基礎",
          question: "She (     ) to school every morning.",
          choices: ["go", "goes", "going", "went"],
          answer: "goes",
          hint: "主語が三人称単数（She）で、習慣を表す現在形です。",
          explain: "主語が3人称単数現在なので動詞に -es をつけて goes にします。",
          similar: "He (study) English every day. → studies"
        },
        {
          id: "q2",
          unit: "英語・基礎",
          question: "「昨日、私は図書館で本を借りた」を英語で表すとき、borrow の過去形はどれ？",
          choices: ["borrow", "borrowed", "borrowing", "borrows"],
          answer: "borrowed",
          hint: "「昨日」を表す過去形なので、規則動詞の語尾に注目しましょう。",
          explain: "borrow は規則動詞のため、過去形は -ed をつけて borrowed になります。",
          similar: "I (visit) Kyoto last month. → visited"
        },
        {
          id: "q3",
          unit: "数学・計算",
          question: "2x + 5 = 17 のとき、x の値を半角数字で答えなさい。",
          choices: [],
          answer: "6",
          hint: "まず両辺から 5 を引いて 2x = 12 にしましょう。",
          explain: "2x = 17 - 5 = 12 なので、両辺を2で割ると x = 6 です。",
          similar: "3x - 4 = 11 → x = 5"
        },
        {
          id: "q4",
          unit: "理科・化学",
          question: "水が電気分解されたとき、陰極（−極）側に発生する気体はどれ？",
          choices: ["
